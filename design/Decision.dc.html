<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
  <style>
    body { margin: 0; font-family: 'IBM Plex Sans', system-ui, sans-serif; }
    a { color: #0E7A57; } a:hover { color: #0B6046; }
    .num { font-family: 'IBM Plex Mono', ui-monospace, monospace; font-variant-numeric: tabular-nums; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; background: #F8FAFC; color: #0F172A; display: flex; flex-direction: column; overflow: hidden;">

  <div style="padding: 16px 20px 0; display: flex; align-items: center; justify-content: space-between;">
    <div style="display: flex; align-items: center; gap: 9px;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#64748B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
      <div style="font-family: 'Archivo', sans-serif; font-weight: 600; font-size: 15px;">Fix &amp; Flip</div>
    </div>
    <div style="display: flex; gap: 3px; background: #E2E8F0; padding: 3px; border-radius: 999px;">
      <div style="padding: 5px 11px; border-radius: 999px; background: #FFFFFF; font-size: 11px; font-weight: 600; color: #0F172A;">Max offer</div>
      <div style="padding: 5px 11px; border-radius: 999px; font-size: 11px; color: #64748B;">Profit</div>
    </div>
  </div>

  <div style="padding: 26px 20px 22px; text-align: center;">
    <div style="font-size: 11px; letter-spacing: 0.8px; text-transform: uppercase; color: #64748B;">Your maximum offer</div>
    <div style="font-family: 'Archivo', sans-serif; font-weight: 700; font-size: 54px; letter-spacing: -2.2px; line-height: 1.05; margin-top: 8px; color: #0F172A;">$237,483</div>
    <div style="display: inline-flex; align-items: center; gap: 6px; margin-top: 14px; background: #FEF3C7; padding: 6px 12px; border-radius: 999px;">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#B45309" stroke-width="2.4" stroke-linecap="round"><path d="M12 9v4"/><path d="M12 17h.01"/><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"/></svg>
      <span style="font-size: 12px; font-weight: 600; color: #B45309;">Thin margin at 14.0%</span>
    </div>
  </div>

  <div style="height: 1px; background: #E2E8F0; margin: 0 20px;"></div>

  <div style="padding: 20px 20px 0;">
    <div style="display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 11px;">
      <span style="font-size: 12px; font-weight: 600; color: #0F172A;">What a buyer pays</span>
      <span class="num" style="font-size: 13px; font-weight: 600; color: #0E7A57;">70% of ARV</span>
    </div>
    <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 7px;">
      <div class="num" style="height: 46px; display: flex; align-items: center; justify-content: center; font-size: 14px; border-radius: 10px; background: #FFFFFF; color: #475569; border: 1px solid #E2E8F0;">50%</div>
      <div class="num" style="height: 46px; display: flex; align-items: center; justify-content: center; font-size: 14px; border-radius: 10px; background: #FFFFFF; color: #475569; border: 1px solid #E2E8F0;">55%</div>
      <div class="num" style="height: 46px; display: flex; align-items: center; justify-content: center; font-size: 14px; border-radius: 10px; background: #FFFFFF; color: #475569; border: 1px solid #E2E8F0;">60%</div>
      <div class="num" style="height: 46px; display: flex; align-items: center; justify-content: center; font-size: 14px; border-radius: 10px; background: #FFFFFF; color: #475569; border: 1px solid #E2E8F0;">65%</div>
      <div class="num" style="height: 46px; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 600; border-radius: 10px; background: #0E7A57; color: #FFFFFF; border: 1px solid #0E7A57;">70%</div>
      <div class="num" style="height: 46px; display: flex; align-items: center; justify-content: center; font-size: 14px; border-radius: 10px; background: #FFFFFF; color: #475569; border: 1px solid #E2E8F0;">75%</div>
      <div class="num" style="height: 46px; display: flex; align-items: center; justify-content: center; font-size: 14px; border-radius: 10px; background: #FFFFFF; color: #475569; border: 1px solid #E2E8F0;">80%</div>
      <div class="num" style="height: 46px; display: flex; align-items: center; justify-content: center; font-size: 14px; border-radius: 10px; background: #FFFFFF; color: #475569; border: 1px solid #E2E8F0;">85%</div>
    </div>
  </div>

  <div style="padding: 20px 20px 0; display: flex; flex-direction: column; gap: 10px;">

    <div style="background: #FFFFFF; border: 1px solid #E2E8F0; border-radius: 14px; padding: 14px 16px;">
      <div style="display: flex; align-items: center; justify-content: space-between;">
        <span style="font-size: 12px; color: #475569;">ARV</span>
        <div style="display: flex; align-items: center; gap: 8px;">
          <span class="num" style="font-size: 18px; font-weight: 600;">$357,244</span>
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#94A3B8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
        </div>
      </div>
      <div style="display: flex; align-items: center; gap: 7px; margin-top: 10px; padding-top: 10px; border-top: 1px solid #F1F5F9;">
        <div style="display: flex; align-items: center; gap: 5px; background: #ECFDF5; padding: 5px 10px; border-radius: 999px;">
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#0E7A57" stroke-width="2.2" stroke-linecap="round"><path d="M20 6 9 17l-5-5"/></svg>
          <span style="font-size: 11px; font-weight: 500; color: #0B6046;">From 4 comps</span>
        </div>
        <span style="font-size: 11px; color: #94A3B8;">$193.10 / sqft avg</span>
      </div>
    </div>

    <div style="background: #FFFFFF; border: 1px solid #E2E8F0; border-radius: 14px; padding: 14px 16px;">
      <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px;">
        <span style="font-size: 12px; color: #475569;">Rehab</span>
        <span class="num" style="font-size: 18px; font-weight: 600;">$25,000</span>
      </div>
      <div style="position: relative; height: 4px; background: #E2E8F0; border-radius: 999px;">
        <div style="position: absolute; left: 0; top: 0; height: 4px; width: 34%; background: #0E7A57; border-radius: 999px;"></div>
        <div style="position: absolute; left: 34%; top: 50%; transform: translate(-50%, -50%); width: 22px; height: 22px; border-radius: 999px; background: #FFFFFF; border: 2px solid #0E7A57; box-shadow: 0 1px 3px rgba(15,23,42,0.16);"></div>
      </div>
      <div style="display: flex; justify-content: space-between; margin-top: 9px;">
        <span class="num" style="font-size: 10px; color: #94A3B8;">$0</span>
        <span style="font-size: 10px; color: #94A3B8;">$13.51 / sqft</span>
        <span class="num" style="font-size: 10px; color: #94A3B8;">$75k</span>
      </div>
    </div>

  </div>

  <div style="flex: 1;"></div>

  <div style="padding: 14px 20px; border-top: 1px solid #E2E8F0; background: #FFFFFF; display: flex; align-items: center; justify-content: space-between;">
    <div style="display: flex; flex-direction: column; gap: 2px;">
      <span style="font-size: 10px; letter-spacing: 0.6px; text-transform: uppercase; color: #64748B;">Profit</span>
      <span class="num" style="font-size: 16px; font-weight: 600; color: #0B6046;">$50,000</span>
    </div>
    <div style="display: flex; flex-direction: column; gap: 2px;">
      <span style="font-size: 10px; letter-spacing: 0.6px; text-transform: uppercase; color: #64748B;">Cash in</span>
      <span class="num" style="font-size: 16px; font-weight: 600;">$102,125</span>
    </div>
    <div style="display: flex; align-items: center; gap: 6px; height: 44px; padding: 0 18px; border-radius: 10px; background: #0E7A57;">
      <span style="font-size: 14px; font-weight: 600; color: #FFFFFF;">Details</span>
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
